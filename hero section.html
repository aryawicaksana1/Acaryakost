<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Hero Section</title>
    
    <!-- Memuat font Inter dari Google Fonts untuk tampilan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Font Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Mengatasi transisi background-image agar halus */
        #bg-layer {
            transition: background-image 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        
        /* Animasi masuk untuk konten teks pertama kali dimuat */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Styling spesifik untuk interaksi thumbnail */
        .thumbnail-active {
            border-color: white !important;
            opacity: 1 !important;
            transform: scale(1.1) !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6) !important;
        }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden font-sans">

    <!-- Kontainer Utama -->
    <main class="relative w-full h-screen flex flex-col justify-between items-center">
        
        <!-- Layer Background Gambar Utama (Default gambar Rumah) -->
        <div id="bg-layer" class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2000&auto=format&fit=crop');"></div>
        
        <!-- Overlay Gelap agar teks selalu terbaca kontras -->
        <div class="absolute inset-0 bg-black/60 z-10 transition-opacity duration-500 hover:bg-black/50"></div>

        <!-- Konten Teks Rata Kiri Sesuai Referensi Gambar -->
        <div class="relative z-20 flex-1 flex flex-col justify-center items-start text-left px-6 md:px-16 lg:px-24 w-full max-w-7xl mx-auto animate-fade-in-up">
            
            <!-- Badge / Subtitle Hijau -->
            <span id="hero-subtitle" class="bg-[#15a34a] text-white font-semibold px-5 py-2 rounded-full mb-6 text-sm md:text-base transition-all duration-300 shadow-lg">
                Hunian Premium Tahun 2025/2026
            </span>
            
            <!-- Judul Utama (Sebagian teks berwarna hijau) -->
            <h1 id="hero-title" class="text-white text-5xl md:text-6xl lg:text-7xl font-extrabold mb-6 drop-shadow-xl transition-all duration-300 tracking-tight leading-tight">
                Temukan Kenyamanan <br>
                <span class="text-[#22c55e]">Rumah Kedua Anda</span>
            </h1>
            
            <!-- Deskripsi -->
            <p id="hero-desc" class="text-gray-200 text-lg md:text-xl font-normal mb-8 max-w-2xl drop-shadow-md transition-all duration-300 leading-relaxed">
                Solusi hunian modern yang dikelilingi oleh kenyamanan dan akses strategis. Langkah pertama menuju gaya hidup berkualitas dimulai dari sini.
            </p>
            
            <!-- Bagian Avatar "Dipercaya oleh..." -->
            <div class="flex items-center gap-4 mt-2">
                <div class="flex -space-x-3">
                    <img class="w-10 h-10 rounded-full border-2 border-gray-800 object-cover" src="https://i.pravatar.cc/100?img=11" alt="Penghuni 1">
                    <img class="w-10 h-10 rounded-full border-2 border-gray-800 object-cover" src="https://i.pravatar.cc/100?img=12" alt="Penghuni 2">
                    <img class="w-10 h-10 rounded-full border-2 border-gray-800 object-cover" src="https://i.pravatar.cc/100?img=13" alt="Penghuni 3">
                    <div class="w-10 h-10 rounded-full border-2 border-gray-800 bg-[#15a34a] flex items-center justify-center text-white text-lg font-bold z-10">
                        +
                    </div>
                </div>
                <p class="text-gray-300 text-sm md:text-base">
                    Dipercaya oleh <span class="font-bold text-white">ratusan</span> penghuni
                </p>
            </div>
        </div>

        <!-- Kontainer Thumbnail di Bawah (Rata Kiri mengikuti teks) -->
        <div class="relative z-20 w-full pb-12 px-4 md:px-16 lg:px-24">
            <div class="flex justify-start items-center gap-4 md:gap-6 flex-wrap max-w-7xl mx-auto">
                
                <!-- Thumbnail 1 (Aktif) -->
                <button onclick="changeBg(this, 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2000&auto=format&fit=crop', 'Hunian Premium Tahun 2025/2026', 'Temukan Kenyamanan <br><span class=\'text-[#22c55e]\'>Rumah Kedua Anda</span>', 'Solusi hunian modern yang dikelilingi oleh kenyamanan dan akses strategis. Langkah pertama menuju gaya hidup berkualitas dimulai dari sini.')" 
                        class="thumbnail thumbnail-active group relative w-24 h-16 md:w-36 md:h-24 rounded-xl overflow-hidden border-2 border-transparent opacity-70 transition-all duration-300 focus:outline-none">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=400&auto=format&fit=crop" alt="Fasad" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/30 group-hover:bg-transparent transition-all"></div>
                </button>

                <!-- Thumbnail 2 -->
                <button onclick="changeBg(this, 'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=2000&auto=format&fit=crop', 'Interior Mewah', 'Desain Ruangan <br><span class=\'text-[#22c55e]\'>Elegan & Modern</span>', 'Nikmati ruang keluarga yang luas dengan pencahayaan alami maksimal, dirancang untuk kehangatan keluarga Anda.')" 
                        class="thumbnail group relative w-24 h-16 md:w-36 md:h-24 rounded-xl overflow-hidden border-2 border-transparent hover:border-white/50 opacity-70 hover:opacity-100 hover:scale-105 transition-all duration-300 focus:outline-none">
                    <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=400&auto=format&fit=crop" alt="Interior" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-transparent transition-all"></div>
                </button>

                <!-- Thumbnail 3 -->
                <button onclick="changeBg(this, 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=2000&auto=format&fit=crop', 'Fasilitas Eksklusif', 'Kolam Renang <br><span class=\'text-[#22c55e]\'>Pribadi Anda</span>', 'Bersantai di akhir pekan dengan fasilitas premium layaknya resor bintang lima tepat di halaman belakang rumah Anda.')" 
                        class="thumbnail group relative w-24 h-16 md:w-36 md:h-24 rounded-xl overflow-hidden border-2 border-transparent hover:border-white/50 opacity-70 hover:opacity-100 hover:scale-105 transition-all duration-300 focus:outline-none">
                    <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=400&auto=format&fit=crop" alt="Kolam Renang" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-transparent transition-all"></div>
                </button>

                <!-- Thumbnail 4 -->
                <button onclick="changeBg(this, 'https://images.unsplash.com/photo-1556910103-1c02745aae4d?q=80&w=2000&auto=format&fit=crop', 'Dapur Idaman', 'Fungsionalitas <br><span class=\'text-[#22c55e]\'>Tanpa Batas</span>', 'Dapur modern terintegrasi dengan perabotan kelas atas untuk pengalaman memasak yang menyenangkan setiap hari.')" 
                        class="thumbnail group relative w-24 h-16 md:w-36 md:h-24 rounded-xl overflow-hidden border-2 border-transparent hover:border-white/50 opacity-70 hover:opacity-100 hover:scale-105 transition-all duration-300 focus:outline-none">
                    <img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?q=80&w=400&auto=format&fit=crop" alt="Dapur" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-transparent transition-all"></div>
                </button>

            </div>
        </div>
    </main>

    <script>
        // Array berisi URL gambar background bertema perumahan
        const bgImages = [
            'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=2000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=2000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1556910103-1c02745aae4d?q=80&w=2000&auto=format&fit=crop'
        ];

        // FUNGSI PRELOAD
        function preloadImages(urls) {
            urls.forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }
        
        window.onload = () => {
            preloadImages(bgImages);
        };

        function changeBg(element, imageUrl, newSubtitle, newTitle, newDesc) {
            const bgLayer = document.getElementById('bg-layer');
            const subtitleEl = document.getElementById('hero-subtitle');
            const titleEl = document.getElementById('hero-title');
            const descEl = document.getElementById('hero-desc');
            
            // Fade out
            subtitleEl.style.opacity = 0;
            titleEl.style.opacity = 0;
            descEl.style.opacity = 0;
            
            titleEl.style.transform = 'translateY(-10px)';
            descEl.style.transform = 'translateY(10px)';

            setTimeout(() => {
                bgLayer.style.backgroundImage = `url('${imageUrl}')`;
                
                // Menggunakan innerHTML (bukan textContent) agar efek warna hijau <span class="text-[#22c55e]"> bisa muncul!
                subtitleEl.innerHTML = newSubtitle;
                titleEl.innerHTML = newTitle;
                descEl.innerHTML = newDesc;

                // Fade in
                subtitleEl.style.opacity = 1;
                titleEl.style.opacity = 1;
                descEl.style.opacity = 1;
                
                titleEl.style.transform = 'translateY(0)';
                descEl.style.transform = 'translateY(0)';
            }, 300);

            // Ganti status aktif thumbnail
            const thumbnails = document.querySelectorAll('.thumbnail');
            thumbnails.forEach(thumb => {
                thumb.classList.remove('thumbnail-active');
            });

            element.classList.add('thumbnail-active');
        }
    </script>
</body>
</html>
