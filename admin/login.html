<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Masuk Akun</h1>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" id="username" required placeholder="Username"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" required placeholder="Password"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">
                Masuk
            </button>

            <a href="../index.html" class="block w-full text-center mt-3 bg-white border border-gray-300 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 transition duration-300 shadow-sm">
                Kembali ke Beranda
            </a>
        </form>
        
        <div id="messageBox" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
    </div>

    <script>
        // Fungsi untuk mengubah teks biasa menjadi string biner
        function textToBinary(text) {
            return text.split('').map(function (char) {
                // Mengambil nilai ASCII dari karakter, ubah ke biner (basis 2), lalu pad(tambahkan) 0 di depan jika panjangnya kurang dari 8
                return char.charCodeAt(0).toString(2).padStart(8, '0');
            }).join(' '); // Pisahkan dengan spasi antar karakter
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.innerText = 'Memproses...';
            submitBtn.disabled = true;

            setTimeout(() => {
                submitBtn.innerText = 'Masuk';
                submitBtn.disabled = false;

                // 1. Username yang ditentukan
                const u = "bosacarya";
                
                // 2. Password yang ditentukan dalam bentuk BINER. 
                // Ini adalah representasi biner untuk kata: "bos123"
                // b = 01100010, o = 01101111, s = 01110011, 1 = 00110001, 2 = 00110010, 3 = 00110011
                const passwordBinerTarget = "01100010 01101111 01110011 00110001 00110010 00110011";

                // 3. Konversi password yang diketik pengguna (teks biasa) menjadi biner
                const passwordBinerInput = textToBinary(password);

                // 4. Bandingkan username (teks) DAN password (biner vs biner)
                if (username === u && passwordBinerInput === passwordBinerTarget) {
                    showMessage('Login berhasil! Mengalihkan...', 'success');
                    setTimeout(() => {
                        window.location.href = 'aplikasi pembayaran/pembayaran.html';
                    }, 1000);
                } else {
                    showMessage('Username atau password salah.', 'error');
                }
            }, 800);
        }

        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerText = text;
            messageBox.className = `mt-4 p-3 rounded-lg text-sm text-center font-medium ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            messageBox.classList.remove('hidden');
            
            setTimeout(() => messageBox.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
