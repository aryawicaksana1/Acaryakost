<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Home Hero Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#1a7042', // Hijau yang identik dengan gambar
                            dark: '#111827',
                            light: '#4b5563'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-white">

    <section class="relative w-full min-h-screen flex items-center overflow-hidden">
        
        <!-- Background Image Container -->
        <!-- Menggunakan gambar rumah mewah modern dari Unsplash -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2000&auto=format&fit=crop" 
                 alt="Modern Luxury Home" 
                 class="w-full h-full object-cover object-center md:object-right">
        </div>

        <!-- Gradient Overlay: Putih pekat di kiri, memudar transparan ke kanan -->
        <!-- Pada mode mobile, warnanya lebih dominan putih agar teks mudah dibaca -->
        <div class="absolute inset-0 z-0 bg-gradient-to-b md:bg-gradient-to-r from-white from-40% md:from-30% via-white/90 md:via-white/70 to-white/30 md:to-transparent"></div>

        <!-- Content Container -->
        <div class="container mx-auto px-6 relative z-10 w-full">
            <div class="max-w-2xl pt-20 pb-16 md:py-0">
                
                <!-- Headline -->
                <h1 class="text-5xl sm:text-6xl md:text-[4rem] font-extrabold text-brand-dark leading-[1.1] mb-4 tracking-tight">
                    Find Your Dream Home <br />
                    <span class="text-brand-green">Live Your Best Life</span>
                </h1>

                <!-- Subheadline -->
                <p class="text-lg md:text-xl text-brand-light mb-10 max-w-lg leading-relaxed font-medium">
                    Explore thousands of verified properties and find a place you'll love to call home.
                </p>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 mb-12">
                    <!-- Primary Button (Green) -->
                    <button class="flex items-center justify-center gap-2 bg-brand-green hover:bg-green-800 text-white px-8 py-4 rounded-xl font-semibold transition-all duration-300 shadow-lg shadow-brand-green/30 hover:-translate-y-1">
                        Explore Properties
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                    
                    <!-- Secondary Button (White with Border) -->
                    <button class="flex items-center justify-center gap-2 bg-white hover:bg-gray-50 text-brand-dark px-8 py-4 rounded-xl font-semibold border border-gray-200 transition-all duration-300 shadow-sm hover:shadow-md">
                        How It Works
                        <div class="w-6 h-6 rounded-full border border-gray-400 flex items-center justify-center">
                            <svg class="w-3 h-3 text-brand-dark ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                        </div>
                    </button>
                </div>

                <!-- Trusted By Section -->
                <div class="flex items-center gap-4">
                    <div class="flex -space-x-3">
                        <img class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm" src="https://i.pravatar.cc/150?img=47" alt="Client 1">
                        <img class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm" src="https://i.pravatar.cc/150?img=11" alt="Client 2">
                        <img class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm" src="https://i.pravatar.cc/150?img=32" alt="Client 3">
                        <div class="w-10 h-10 rounded-full border-2 border-white bg-brand-green text-white flex items-center justify-center text-sm font-bold shadow-sm z-10">
                            +
                        </div>
                    </div>
                    <p class="text-sm font-medium text-gray-600">
                        Trusted by <span class="font-bold text-gray-900">10,000+</span> happy clients
                    </p>
                </div>

            </div>
        </div>

        <!-- Floating Card Widget (Visible on Desktop & Tablet) -->
        <!-- Diposisikan absolut di sudut kanan bawah -->
        <div class="hidden md:flex absolute bottom-12 right-12 z-20 bg-white rounded-2xl p-5 shadow-2xl border border-gray-100 items-center gap-4 transform transition-transform hover:scale-105 cursor-pointer animate-fade-in-up">
            
            <!-- Icon -->
            <div class="w-14 h-14 bg-brand-green rounded-full flex items-center justify-center flex-shrink-0 text-white shadow-inner">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </div>
            
            <!-- Card Text -->
            <div class="pr-6">
                <h4 class="text-sm font-bold text-gray-900 leading-tight">Modern House</h4>
                <p class="text-xs text-gray-500 mb-1">Beverly Hills, CA</p>
                <p class="text-base font-extrabold text-brand-green">$2,450,000</p>
            </div>

            <!-- Arrow Indicator -->
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>
        </div>

    </section>

    <!-- Style for floating card animation -->
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }
    </style>
</body>
</html>
