<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website dengan Lagu</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Background gradient yang lembut */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            margin: 0;
            overflow: hidden; /* Mencegah scroll jika konten berlebih */
        }

        /* Animasi berdenyut untuk ikon musik */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        .music-icon {
            font-size: 5rem;
            color: #3b82f6; /* Warna biru Tailwind (blue-500) */
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 2rem;
        }

        /* Gaya untuk area pesan */
        #messageArea {
            transition: all 0.5s ease;
        }

        /* Custom button styling (fallback dari Tailwind) */
        .btn-play {
            background-color: #3b82f6;
            color: white;
            padding: 10px 24px;
            border-radius: 9999px; /* Fully rounded */
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-play:hover {
            background-color: #2563eb; /* Biru lebih gelap saat hover */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-play:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="text-center p-8 bg-white/80 backdrop-blur-md rounded-2xl shadow-2xl max-w-lg w-11/12">
        <!-- Ikon musik menggunakan SVG -->
        <div class="music-icon" id="musicIcon" style="opacity: 0.5;">
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold mb-4 text-gray-800 tracking-tight">Selamat Datang!</h1>
        
        <div id="messageArea" class="mb-6">
            <p id="statusText" class="text-lg text-gray-600 mb-2">Mencoba memutar lagu secara otomatis...</p>
            <p class="text-sm text-gray-400 italic">(Browser modern sering memblokir putar otomatis)</p>
        </div>

        <!-- Tombol fallback jika autoplay gagal -->
        <button id="playButton" class="btn-play hidden mx-auto flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Putar Lagu Sekarang
        </button>

        <!-- Tombol Pause/Play untuk kontrol -->
        <button id="controlButton" class="hidden mt-4 text-gray-500 hover:text-gray-800 transition mx-auto flex items-center gap-1 font-medium">
            <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            <span id="controlText">Jeda Lagu</span>
        </button>
    </div>

    <!-- Element audio (tersembunyi). Ganti URL src dengan link MP3 Anda -->
    <!-- Contoh menggunakan lagu lofi bebas royalti -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('bgMusic');
            const statusText = document.getElementById('statusText');
            const playButton = document.getElementById('playButton');
            const controlButton = document.getElementById('controlButton');
            const controlText = document.getElementById('controlText');
            const musicIcon = document.getElementById('musicIcon');
            const pauseIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
            const playIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;

            let isPlaying = false;

            // Fungsi untuk mengatur tampilan saat lagu diputar
            const setPlayingState = () => {
                isPlaying = true;
                statusText.innerHTML = '<span class="text-green-500 font-semibold">🎵 Sedang memutar lagu</span>';
                playButton.classList.add('hidden');
                controlButton.classList.remove('hidden');
                musicIcon.style.opacity = '1';
                musicIcon.style.animationPlayState = 'running';
                
                // Update tombol kontrol
                controlButton.innerHTML = pauseIcon + ' <span id="controlText">Jeda Lagu</span>';
            };

            // Fungsi untuk mengatur tampilan saat lagu dijeda
            const setPausedState = () => {
                isPlaying = false;
                statusText.innerHTML = '<span class="text-yellow-600 font-semibold">⏸️ Lagu dijeda</span>';
                musicIcon.style.animationPlayState = 'paused';
                musicIcon.style.opacity = '0.5';
                
                // Update tombol kontrol
                controlButton.innerHTML = playIcon + ' <span id="controlText">Lanjutkan Lagu</span>';
            };

            // Mencoba memutar audio secara otomatis
            const tryAutoplay = async () => {
                try {
                    // Beberapa browser memerlukan interaksi sebelum memutar suara.
                    // Jika autoplay diblokir, ini akan memicu error.
                    await audio.play();
                    setPlayingState();
                    console.log("Autoplay berhasil!");
                } catch (error) {
                    console.warn("Autoplay dicegah oleh browser:", error);
                    // Jika gagal, tampilkan tombol agar pengguna bisa memutarnya manual
                    statusText.innerHTML = 'Klik tombol di bawah untuk memutar lagu.';
                    playButton.classList.remove('hidden');
                }
            };

            // Panggil autoplay saat halaman dimuat
            // Timeout kecil terkadang membantu di beberapa browser
            setTimeout(tryAutoplay, 500);

            // Event listener untuk tombol fallback (jika autoplay gagal)
            playButton.addEventListener('click', () => {
                audio.play()
                    .then(() => {
                        setPlayingState();
                    })
                    .catch(err => {
                        console.error("Gagal memutar:", err);
                        statusText.innerText = "Gagal memutar lagu. Silakan coba lagi.";
                    });
            });

            // Event listener untuk tombol kontrol (Pause/Play)
            controlButton.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    setPausedState();
                } else {
                    audio.play();
                    setPlayingState();
                }
            });

            // Interaksi klik di mana saja (sebagai backup jika autoplay gagal)
            // Seringkali browser memblokir autoplay, tapi mengizinkan jika ada interaksi klik dari user di mana saja di halaman
            document.body.addEventListener('click', () => {
                 if (!isPlaying && document.activeElement !== playButton && document.activeElement !== controlButton) {
                    audio.play().then(() => {
                        setPlayingState();
                    }).catch(e => console.log("Klik background belum cukup untuk play", e));
                 }
            }, { once: false }); // Biarkan true jika ingin hanya sekali coba, false agar user bisa klik dimana saja kapan saja untuk play jika belum play
        });
    </script>
</body>
</html>
